name: CLA

# Signatures are committed to a separate, unprotected repo (the action cannot
# push to a protected branch). PERSONAL_ACCESS_TOKEN must be a fine-grained
# token limited to that repo with Contents: read/write.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLA:
    name: CLA          # required status check; keep in sync with cla-merge-queue.yml
    runs-on: ubuntu-latest
    steps:
      # Never check out PR code here: pull_request_target runs with a write token.
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: ribtoks/cla-github-action@f22feedd1f3f46f23fab3bc100081d349f9108af # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/spyre-inference/cla.json
          path-to-document: https://github.com/torch-spyre/spyre-inference/blob/main/CLA.md
          branch: main
          remote-organization-name: torch-spyre
          remote-repository-name: cla-signatures
          allowlist: '*[bot]'
